<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせありがとうございます | kohei yamasaki</title>
  <style>
    @font-face {
      font-family: 'MidashiGo-MB31';
      src: url('fonts/MidashiGo-MB31.otf') format('opentype');
      font-weight: bold; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'FuturaKY';
      src: url('fonts/FuturaMedium.otf') format('opentype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #111111; --gray: #888; --bg: #fafaf8;
      --font-midashi: 'MidashiGo-MB31', 'A-OTF 見出ゴMB31 Pr6N', sans-serif;
      --font-sans: 'FuturaKY', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body { background: var(--bg); color: var(--black); font-family: var(--font-sans); }
    a { text-decoration: none; color: inherit; }
    a:hover { opacity: 0.6; }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 32px;
      background: rgba(250,250,248,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .site-name { font-family: var(--font-sans); font-size: 13px; letter-spacing: 0.1em; }
    .back-link { font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.15em; color: var(--gray); text-transform: uppercase; }

    .thanks-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 32px 80px;
      gap: 32px;
    }

    .thanks-wrap h1 {
      font-family: var(--font-sans);
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 400;
      letter-spacing: 0.2em;
    }

    .thanks-wrap p {
      font-family: var(--font-midashi);
      font-size: clamp(13px, 1.4vw, 15px);
      color: #555;
      line-height: 2;
    }

    .back-btn {
      display: inline-block;
      margin-top: 8px;
      font-family: var(--font-midashi);
      font-size: 13px;
      letter-spacing: 0.15em;
      color: var(--black);
      border: 1px solid var(--black);
      padding: 14px 40px;
      transition: background 0.2s, color 0.2s;
    }
    .back-btn:hover { background: var(--black); color: #fff; opacity: 1; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FQWQCY2744"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FQWQCY2744');
  </script>
</head>
<body>

  <header>
    <a href="index.html" class="site-name">kohei yamasaki</a>
    <a href="index.html" class="back-link">← Back</a>
  </header>

  <div class="thanks-wrap">
    <h1>THANK YOU</h1>
    <p>
      お問い合わせいただきありがとうございます。<br>
      内容を確認後、担当者よりご連絡いたします。<br>
      しばらくお待ちください。
    </p>
    <a href="index.html" class="back-btn">トップページへ戻る</a>
  </div>

</body>
</html>
